<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#4a2aa8">
<title>Мой город</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<main id="app">
  <div class="map" id="map"></div>
  <div class="hud">
    <div class="hrow">
      <div class="daycard" id="dayCard">
        <span class="dcity"><svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="dcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcff"/><stop offset="1" stop-color="#3f7cff"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#dcg)"/><circle cx="31" cy="9.5" r="3.4" fill="#ffe27a"/><rect x="6.5" y="17" width="9" height="16" rx="1.6" fill="#fff"/><rect x="17.5" y="9" width="9.5" height="24" rx="1.6" fill="#ffe9a8"/><rect x="28.5" y="20" width="6" height="13" rx="1.6" fill="#fff"/><g fill="#6b8fe8"><rect x="9" y="20" width="2" height="2.4" rx=".5"/><rect x="11.8" y="20" width="2" height="2.4" rx=".5"/><rect x="9" y="25" width="2" height="2.4" rx=".5"/><rect x="11.8" y="25" width="2" height="2.4" rx=".5"/><rect x="20" y="12.5" width="2" height="2.4" rx=".5"/><rect x="23" y="12.5" width="2" height="2.4" rx=".5"/><rect x="20" y="18" width="2" height="2.4" rx=".5"/><rect x="23" y="18" width="2" height="2.4" rx=".5"/><rect x="20" y="23.5" width="2" height="2.4" rx=".5"/><rect x="23" y="23.5" width="2" height="2.4" rx=".5"/></g><rect x="4" y="32" width="32" height="4.5" rx="2.25" fill="#4cc27a"/></svg></span>
        <div class="dmain">
          <div class="dtop"><span class="dtxt" id="dayPill">День 1 из 7</span><svg class="dsun" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#ffb020" stroke-width="2.2" stroke-linecap="round"><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M19.2 4.8l-1.8 1.8M6.6 17.4l-1.8 1.8"/></g><circle cx="12" cy="12" r="5.6" fill="#ffd23f" stroke="#f29a12" stroke-width="1.2"/></svg></div>
          <div class="dbar"><i id="dayFill"></i></div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="audio">
        <button class="icon" data-act="music" data-music aria-label="Музыка"></button>
        <button class="icon" data-act="sfx" data-sfx aria-label="Звуковые эффекты"></button>
      </div>
      <button class="icon exit" data-act="askLeave" aria-label="В меню"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="hrow stats">
      <button type="button" class="stat money" id="flowBtn" data-act="flow"><span class="sico2 gold"><i class="coin"></i></span><span class="sbody"><span class="sval" id="coins">0</span><span class="ssub" id="coinSub">+0</span></span></button>
      <div class="stat" id="peoplePill" title="Жители"><span class="sico2 green" id="peopleIco"></span><span class="sbody"><span class="sval" id="people">100</span><span class="ssub" id="peopleSub">0</span></span></div>
      <div class="stat" id="happyPill" title="Счастье жителей"><span class="sico2" id="smile"></span><span class="sbody"><span class="sval" id="happy">60</span><span class="ssub" id="happySub">0</span></span></div>
    </div>
  </div>
  <div class="flowbox" id="flowbox"></div>
  <button class="req" id="req" data-act="req"></button>
  <div class="bottom"><div class="decs" id="decs"></div><button class="btn primary" id="endBtn" data-act="evening">Закончить день</button></div>
  <div class="sheetShade" id="sheetShade"><section class="sheet" id="sheet"></section></div>
  <div class="shade" id="shade"><div class="dialog" id="dialog"></div></div>
  <div class="start" id="start"></div>
  <div class="result hidden" id="result"></div>
  <div class="shade" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="dialog">
      <div class="stage">
        <h2 id="confirmTitle">Вернуться в меню?</h2>
        <p id="confirmText">Этот город начнётся сначала. Ничего страшного — можно сразу играть снова.</p>
        <div class="actions">
          <button class="btn primary" data-act="stay">Остаться</button>
          <button class="btn secondary" data-act="leave">В меню</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</main>
<script src="data/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
