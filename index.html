<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#4a2aa8">
<title>Мой город</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<main id="app">
  <div class="map" id="map"></div>
  <div class="hud">
    <div class="hrow">
      <div class="daybub" id="dayCard"><i class="dfill" id="dayFill"></i><span class="dtxt" id="dayPill">1 день из 7</span></div>
      <button type="button" class="stat money" id="flowBtn" data-act="flow"><span class="sico2 gold"><i class="coin"></i></span><span class="sbody"><span class="sval" id="coins">0</span></span></button>
      <div class="stat" id="peoplePill" title="Жители"><span class="sico2 green" id="peopleIco"></span><span class="sbody"><span class="sval" id="people">100</span></span></div>
      <div class="stat" id="happyPill" title="Счастье жителей"><span class="sico2" id="smile"></span><span class="sbody"><span class="sval" id="happy">60</span></span></div>
      <button class="icon" data-act="sound" data-sound aria-label="Звук"></button>
      <button class="icon exit" data-act="askLeave" aria-label="В меню"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <div class="flowbox" id="flowbox"></div>
  <button class="req" id="req" data-act="req"></button>
  <div class="bottom"><div class="decs" id="decs"></div><button class="btn primary" id="endBtn" data-act="evening">Закончить день</button></div>
  <div class="sheetShade" id="sheetShade"><section class="sheet" id="sheet"></section></div>
  <div class="shade" id="shade"><div class="dialog" id="dialog"></div></div>
  <div class="start" id="start"></div>
  <div class="result hidden" id="result"></div>
  <div class="shade" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="dialog">
      <div class="stage">
        <h2 id="confirmTitle">Вернуться в меню?</h2>
        <p id="confirmText">Этот город начнётся сначала. Ничего страшного — можно сразу играть снова.</p>
        <div class="actions">
          <button class="btn primary" data-act="stay">Остаться</button>
          <button class="btn secondary" data-act="leave">В меню</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</main>
<script src="data/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
