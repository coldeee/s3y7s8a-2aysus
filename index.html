<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#4a2aa8">
<title>Мой город</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<main id="app">
  <div class="map" id="map"></div>
  <div class="hud">
    <button class="icon" data-act="askLeave" aria-label="В меню">✕</button>
    <div class="pill" id="dayPill">День <span id="day">1</span> из 7</div>
    <div class="spacer"></div>
    <div class="audio">
      <button class="icon" data-act="sfx" data-sfx aria-label="Звуковые эффекты"></button>
      <button class="icon" data-act="music" data-music aria-label="Музыка"></button>
    </div>
    <div class="pill" id="peoplePill" title="Жители"><span id="peopleIco"></span><span id="people">100</span></div>
    <div class="pill" id="happyPill" title="Счастье жителей"><span id="smile"></span><span id="happy">60</span></div>
    <button type="button" class="pill money" id="flowBtn" data-act="flow"><span class="cash"><span id="coins">0</span><i class="coin"></i></span><span class="flow"><span class="in" id="dayIn">+0</span><span class="out" id="dayOut">−0</span></span></button>
  </div>
  <div class="flowbox" id="flowbox"></div>
  <button class="req" id="req" data-act="req"></button>
  <div class="bottom"><div class="decs" id="decs"></div><button class="btn primary" id="endBtn" data-act="evening">Закончить день</button></div>
  <div class="sheetShade" id="sheetShade"><section class="sheet" id="sheet"></section></div>
  <div class="shade" id="shade"><div class="dialog" id="dialog"></div></div>
  <div class="start" id="start"></div>
  <div class="result hidden" id="result"></div>
  <div class="shade" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="dialog">
      <div class="stage">
        <h2 id="confirmTitle">Вернуться в меню?</h2>
        <p id="confirmText">Этот город начнётся сначала. Ничего страшного — можно сразу играть снова.</p>
        <div class="actions">
          <button class="btn primary" data-act="stay">Остаться</button>
          <button class="btn secondary" data-act="leave">В меню</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</main>
<script src="data/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
