<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#4a2aa8">
<title>Мой город</title>
<style>
:root{--g:#7b4cf0;--gd:#4a2aa8;--ink:#1c0f4a;--mut:#6b6488;--warn:#e0583f;--gold:#f2b632}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1e5fb0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:inherit;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
#app{position:relative;max-width:480px;height:100%;height:100vh;height:100dvh;min-height:520px;margin:0 auto;overflow:hidden;background:#3d8fd8}
.map{position:absolute;inset:0}
.map svg{width:100%;height:100%;display:block}
[data-act]{cursor:pointer}
.coin{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;margin-left:3px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='r' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffe68a'/><stop offset='1' stop-color='%23c97a0c'/></linearGradient><radialGradient id='f' cx='.35' cy='.3' r='.85'><stop offset='0' stop-color='%23fff7c2'/><stop offset='.45' stop-color='%23ffd23f'/><stop offset='1' stop-color='%23f0a01a'/></radialGradient></defs><circle cx='20' cy='21.5' r='18' fill='%23a8620a'/><circle cx='20' cy='20' r='18' fill='url(%23r)'/><circle cx='20' cy='20' r='14.5' fill='url(%23f)'/><circle cx='20' cy='20' r='12' fill='none' stroke='%23e39a16' stroke-width='1.4' stroke-dasharray='1.6 2.2'/><path d='M16.5 28V12.5h5.2a4.4 4.4 0 0 1 0 8.8h-7.2M14.5 24.7h7' fill='none' stroke='%23b8680a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M16.5 27V11.5h5.2a4.4 4.4 0 0 1 0 8.8h-7.2M14.5 23.7h7' fill='none' stroke='%23fff3c0' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M8 15a13 13 0 0 1 9-8.5' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' fill='none' opacity='.85'/></svg>") center/contain no-repeat;filter:drop-shadow(0 1px 1px #8a4a0040)}
.ico{width:1.35em;height:1.35em;vertical-align:-.3em}
/* верх */
.hud{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 6px}
.icon{background:#fdfbff;border-radius:13px;width:40px;height:40px;font-size:17px;font-weight:800;box-shadow:0 3px 10px #2a106040;flex:none;display:flex;align-items:center;justify-content:center;color:#3b2a7a}
.icon svg{width:20px;height:20px}
.pill{background:#fdfbff;border-radius:13px;padding:9px 11px;font-size:14px;font-weight:800;box-shadow:0 3px 10px #2a106040;white-space:nowrap;display:flex;align-items:center;gap:4px}
.money{background:linear-gradient(180deg,#fff7d9,#ffe28f);color:#5e4100;font-size:16px;border:1.5px solid #f0c64f}
.spacer{flex:1}
.req{position:absolute;top:calc(60px + env(safe-area-inset-top));left:10px;right:10px;z-index:3;background:#ffffffb8;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px #2a106040;text-align:left;width:auto}
.req.done{background:#efe7ffc0}
.req.pop{animation:reqpop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes reqpop{from{transform:translateY(-50px) scale(.9);opacity:0}}
.req .face{width:50px;height:50px;flex:none}
.req b{font-size:14px}
.req p{margin:2px 0 0;font-size:13px;line-height:1.3;color:#4a4170}
.req .chev{margin-left:auto;font-size:24px;color:var(--g);font-weight:900}
.heart{color:#e8574a}
/* низ */
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#1c0f4a00,#1c0f4aa8 35%,#1c0f4ad8)}
.decs{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:800;font-size:14px;margin:4px 0 9px}
.decs i{width:18px;height:18px;border-radius:50%;background:#d4b8ff;display:inline-block;box-shadow:inset 0 -2px 0 #8a5cf0}
.decs i.off{background:#ffffff40;box-shadow:none}
.btn{width:100%;border-radius:16px;padding:14px;font-weight:900;font-size:16px}
.primary{background:linear-gradient(180deg,#a882ff,#7b4cf0 55%,#6236e0);color:#fff;box-shadow:inset 0 0 0 1.5px #ffffff70,inset 0 2px 8px #ffffff70,inset 0 -6px 12px #3b168f60,0 8px 18px #4a1fa055}
.primary:not(:disabled):active{transform:scale(.97)}
.secondary{background:#fff;border:1.5px solid #ddd0ff;color:#3b1c96}
.ghost{background:transparent;color:#5b4f87}
/* лист здания */
.sheetShade{position:absolute;inset:0;z-index:8;background:#1c0f4a80;display:none;align-items:flex-end}
.sheetShade.show{display:flex}
.sheet{width:100%;max-height:86%;overflow:auto;background:#fbf9ff;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.shead{display:flex;gap:12px;align-items:center}
.sico{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.sico svg{width:44px;height:44px}
.shead h2{margin:0;font-size:22px}
.lvl{font-size:13px;color:var(--mut);font-weight:700}
.sheet p{font-size:14px;line-height:1.45;margin:10px 0}
.effs{display:flex;flex-wrap:wrap;gap:6px}
.eff{background:#f1ebff;border-radius:11px;padding:8px 10px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px}
.eff.cost{background:#fff1ee;color:#a2412c}
.reqbox{background:#f6efff;border:1.5px solid #d9c2ff;border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
.nobox{background:#f4f0fb;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13px;color:#5b5480}
.nobox b{display:block;color:var(--ink);margin-bottom:3px;font-size:14px}
.sacts{display:grid;gap:8px;margin-top:14px}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#efe9fb;font-size:18px;font-weight:900;color:#5b5480}
/* диалог */
.shade{position:absolute;inset:0;z-index:14;background:#1c0f4ac4;display:none;align-items:center;justify-content:center;padding:14px}
.shade.show{display:flex}
.dialog{width:100%;max-height:92%;overflow:auto;background:#fbf9ff;border-radius:26px;padding:20px 18px;text-align:center;animation:pop .25s ease;position:relative}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.dialog h2{font-size:22px;margin:6px 0 10px}
.dialog p{font-size:15px;line-height:1.45;color:#4a4170}
.kicker{font-size:11px;letter-spacing:1px;font-weight:900;color:var(--g)}
.actions{display:grid;gap:8px;margin-top:14px}
.quote{display:flex;gap:10px;align-items:center;text-align:left;background:#f5f0ff;border-radius:16px;padding:10px 12px;margin:8px 0}
.quote .face{width:54px;height:54px;flex:none}
.quote p{margin:2px 0 0;font-size:14px}
.event{text-align:left;background:#fff0f6;border-radius:16px;padding:12px;margin-top:10px}
.event b{font-size:15px}
.event p{margin:4px 0 0!important;font-size:14px!important}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #ddd0ff;border-radius:14px;padding:11px 12px;margin-top:8px}
.opt b{display:block;font-size:15px}
.opt small{font-size:13px;color:var(--mut)}
.opt.go{border-color:#c4a8ff;background:#f6f1ff}
.howto{text-align:left;list-style:none;padding:0;margin:8px 0;counter-reset:s}
.howto li{background:#f5f0ff;border-radius:12px;padding:10px 12px 10px 42px;margin:6px 0;font-size:15px;line-height:1.35;position:relative}
.howto li:before{counter-increment:s;content:counter(s);position:absolute;left:10px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ledger{text-align:left;background:#f5f0ff;border-radius:14px;padding:6px 12px;margin:10px 0}
.ledger div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;font-size:15px;border-bottom:1px dashed #e3d8ff}
.ledger div:last-child{border:0}
.ledger .total{font-weight:900;font-size:17px}
.plus{color:#1fa463}
.minus{color:var(--warn)}
/* ===== шарик и уточки ===== */
#fly{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balloon{position:absolute;left:0;top:21%;animation:fly 46s -14s linear infinite;will-change:transform}
.balloon .bb{animation:bobb 4s ease-in-out infinite;filter:drop-shadow(0 6px 6px #1c0f4a30)}
@keyframes fly{from{transform:translateX(-60px)}to{transform:translateX(560px)}}
@keyframes bobb{50%{transform:translateY(-10px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.balloon,.bb{animation:none}}
/* ===== карта-картинка ===== */
.map{overflow:hidden;background:#3d8fd8}
#mwrap{position:absolute}
#mimg{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%}
#fx .hl{fill-opacity:.22;animation:hl 1.6s ease-in-out infinite}
@keyframes hl{50%{fill-opacity:.38}}
#fx .sweep{animation:sweep 1.8s ease-in-out infinite;transform:skewX(-18deg)}
@keyframes sweep{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(140px) skewX(-18deg)}}
#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:none;padding:0 0 9px;animation:float 3s ease-in-out infinite;transition:transform .2s}
.pin:after{content:"";position:absolute;left:50%;bottom:2px;width:12px;height:12px;background:var(--c2);transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1;box-shadow:2px 2px 6px #1c0f4a40}
@keyframes float{50%{margin-top:-5px}}
.ico3{position:relative;display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 0 0 1.5px #ffffff80,inset 0 -5px 10px #00000030,inset 0 3px 6px #ffffff90,0 8px 18px #1c0f4a59;overflow:visible}
.ico3:before{content:"";position:absolute;left:6px;right:6px;top:4px;height:42%;border-radius:12px 12px 18px 18px;background:linear-gradient(#ffffffb5,#ffffff00)}
.big3{width:60px;height:60px;border-radius:19px;flex:none}
.big3 svg{width:34px!important;height:34px!important}
.ico3 svg{position:relative;width:28px;height:28px;filter:drop-shadow(0 1.5px 1.5px #00000040)}
.lv{position:absolute;top:-7px;right:-9px;min-width:20px;height:20px;border-radius:999px;background:#1c0f4a;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px}
.pin.on{animation:none;transform:translate(-50%,-100%) scale(1.15);z-index:2}
.pin.on .ico3{box-shadow:inset 0 0 0 2px #fff,inset 0 -5px 10px #00000030,0 0 0 4px #ffffff90,0 0 24px 6px var(--c1)}
.pin.pop .ico3{animation:popi .6s ease}
@keyframes popi{40%{transform:scale(1.3)}}
.twk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twk 1.8s ease-in-out infinite;filter:drop-shadow(0 0 3px #fff6a0)}
@keyframes twk{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
.burst{position:absolute;width:0;height:0}
.burst i{position:absolute;width:14px;height:14px;margin:-7px;background:#ffe36b;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:burst .85s ease-out forwards}
.burst i:nth-child(2n){background:#fff;width:10px;height:10px}
@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.thumb{position:relative;aspect-ratio:471/480;overflow:hidden;border-radius:18px;margin-top:10px}
.thumb .in{position:absolute;left:0;right:0;top:-40%;aspect-ratio:471/836}
.thumb img{width:100%;height:100%;display:block}
.tpin{position:absolute;transform:translate(-50%,-100%);width:26px;height:26px;border-radius:9px;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px #ffffff90,0 4px 8px #1c0f4a50}
/* ===== новый старт ===== */
.start{position:absolute;inset:0;z-index:12;overflow:hidden;background:linear-gradient(180deg,#5fb8f5,#bfe6ff 55%,#7b4cf0);transition:opacity .45s}
.start.gone{opacity:0}
.sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.3s cubic-bezier(.6,0,.3,1)}
.opening .sbg{transform:scale(1.18)}
.cl{position:absolute;pointer-events:none;transition:transform 1.15s cubic-bezier(.6,0,.3,1)}
.cl svg{display:block;width:100%;height:auto;animation:drift 6s ease-in-out infinite alternate}
.cl2 svg,.cl4 svg{animation-duration:7.5s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.cl1{width:72%;left:-30%;top:-5%;opacity:.95}
.cl2{width:58%;right:-26%;top:12%;opacity:.8}
.cl3{width:48%;left:-26%;top:46%;opacity:.65}
.cl4{width:52%;right:-28%;top:56%;opacity:.7}
.cl5{width:95%;left:-38%;bottom:-7%;opacity:.95}
.cl6{width:80%;right:-36%;bottom:-3%;opacity:.88}
.opening .cl1{transform:translate(-75%,-45%)}
.opening .cl2{transform:translate(75%,-40%)}
.opening .cl3{transform:translateX(-90%)}
.opening .cl4{transform:translateX(90%)}
.opening .cl5{transform:translate(-30%,70%)}
.opening .cl6{transform:translate(40%,70%)}
.logo2{position:absolute;left:5%;right:5%;top:calc(9% + env(safe-area-inset-top));transition:transform 1s cubic-bezier(.5,0,.75,0),opacity .8s}
.logo2 svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px #2a106066)}
.tag2{position:relative;margin:-26px auto 0;width:max-content;max-width:100%;background:linear-gradient(100deg,#ffb3f6,#c48cff 45%,#8f7dff 80%,#9fc4ff);color:#1c0f4a;font-weight:900;font-size:15px;letter-spacing:.2px;padding:9px 16px;border-radius:999px;transform:rotate(-3deg);box-shadow:inset 0 0 0 1.5px #ffffffb0,inset 0 0 12px #ffffff80,0 6px 16px #2a106055}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1deg)}}
.coins{animation:bob 2.4s ease-in-out infinite}
.opening .logo2{transform:translateY(-75vh) scale(.8);opacity:0}
.sbar2{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;transition:opacity .4s}
.cta2{position:absolute;left:14px;right:14px;bottom:calc(30px + env(safe-area-inset-bottom));display:grid;gap:16px;transition:transform .6s,opacity .5s}
.opening .cta2,.opening .sbar2{opacity:0;transform:translateY(30px)}
.big2{justify-self:center;width:84%;font-size:23px;font-weight:800;letter-spacing:-.4px;color:#1c0f4a;padding:21px 18px;border-radius:999px;background:linear-gradient(180deg,#f8ecff 0%,#dcbcff 45%,#b58cff 100%);box-shadow:inset 0 0 0 2px #ffffffc0,inset 0 2px 10px #ffffff,inset 0 0 22px 6px #ffffffa0,inset 0 -8px 18px #8a55f040,0 14px 26px #3a148866,0 0 34px #d4b0ff90;transition:transform .12s}
.big2:active{transform:scale(.97)}
.big2 .arr{margin-left:8px;font-weight:700}
.pill2{justify-self:center;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#faf6ffef,#e6dcffe6);border-radius:999px;padding:12px 22px;font-size:16px;font-weight:600;color:#1c0f4a;box-shadow:inset 0 0 0 1.5px #ffffffd0,inset 0 0 10px #ffffff90,0 6px 16px #2a106040}
/* газета */
.np{padding:12px}
.paper{background:#fbf7ec;border:1px solid #e3d9c2;border-radius:14px;padding:14px 14px 12px;font-family:Georgia,"Times New Roman",serif;text-align:left;color:#1d1a14;box-shadow:inset 0 0 40px #e9dcc0}
.ptop{display:flex;justify-content:space-between;font:700 10px system-ui,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#6b6252;border-bottom:1px solid #2b2b2b;padding-bottom:4px}
.paper .mast{text-align:center;font-weight:900;font-size:25px;letter-spacing:-.3px;padding:6px 0 4px;border-bottom:3px double #2b2b2b}
.paper .date{text-align:center;font-size:11px;color:#6b6252;margin:5px 0 10px;font-family:system-ui,sans-serif}
.paper h3{font-size:22px;line-height:1.15;margin:0 0 8px;letter-spacing:-.3px}
.pphoto{margin:0 0 10px}.pphoto .thumb{margin:0;border-radius:4px;filter:saturate(1.05) contrast(1.02);box-shadow:0 0 0 1px #2b2b2b}
.pphoto figcaption{font-size:11px;font-style:italic;color:#6b6252;margin-top:4px}
.pcols{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;border-top:1px solid #2b2b2b;padding-top:8px}
.pcols>div+div{border-left:1px solid #cfc3a8;padding-left:12px}
.psec{font:900 10px system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#7b4cf0;margin:2px 0 6px}
.paper .more{font-size:14px;font-weight:700;line-height:1.25;padding:0 0 7px;margin:0 0 7px;border-bottom:1px solid #e0d6bf}
.pnum{font-size:11px;color:#6b6252;font-family:system-ui,sans-serif;margin-bottom:6px;line-height:1.1}.pnum b{display:block;font:900 20px Georgia,serif;color:#1d1a14}
.paper>.psec{border-top:1px solid #2b2b2b;padding-top:8px;margin-top:6px}
.ppl{display:grid;gap:8px}
.pp{display:flex;gap:10px;align-items:center}.pp .face{flex:none}
.pp b{display:block;font-size:13px;font-family:system-ui,sans-serif}.pp i{font-size:14px;line-height:1.25}
.pfoot{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #2b2b2b;margin-top:10px;padding-top:8px;font-size:13px;line-height:1.25}
.pfoot small{color:#6b6252;font-size:12px}
.wthr{display:flex;gap:8px;align-items:flex-start;border-left:1px solid #cfc3a8;padding-left:12px}.wthr .ico{width:30px;height:30px;flex:none}
/* газета и название */
.namein{width:100%;font:inherit;font-size:22px;font-weight:800;text-align:center;padding:14px;border-radius:14px;border:2px solid #ddd0ff;margin-top:6px;color:var(--ink);background:#fff}
.paper{background:#fbf7ec;border:1px solid #e3d9c2;border-radius:16px;padding:14px;font-family:Georgia,"Times New Roman",serif;text-align:left}
.paper .mast{text-align:center;font-weight:900;font-size:22px;border-bottom:3px double #2b2b2b;padding-bottom:6px}
.paper .date{text-align:center;font-size:11px;color:#6b6252;margin:5px 0 10px;font-family:system-ui,sans-serif}
.paper h3{font-size:21px;line-height:1.2;margin:0 0 6px}
.paper .more{border-top:1px solid #d9cfb8;padding-top:8px;margin-top:8px;font-size:15px;font-weight:700;line-height:1.3}
.arch{background:#f1ebff;border-radius:14px;padding:12px;margin-top:10px;font-size:16px}
/* старт и итоги */
.sbar{display:flex;align-items:center;gap:10px}

.start,.result{position:absolute;inset:0;z-index:12;overflow:auto}
.brand{font-size:13px;font-weight:900;color:#0b8a55;letter-spacing:.6px}
.preview{border-radius:24px;overflow:hidden;box-shadow:0 10px 26px #1d4b3a40;margin:10px 0 16px;background:#3d8fd8}
.preview svg{display:block;width:100%;height:auto}
.result{background:linear-gradient(180deg,#2a1466,#4a2aa8 30%,#f1ecff 30.1%)}
.rhead{color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 6px;text-align:center}
.rhead h1{margin:6px 0 2px;font-size:38px;color:#ffd65a}
.stars{font-size:44px;color:#ffd65a;letter-spacing:4px;line-height:1}
.stars span{color:#ffffff40}
.rpanel{background:#fbf9ff;border-radius:24px;margin:12px;padding:16px;box-shadow:0 8px 24px #0002}

const CITY_NAMES=['Солнечноград','Радужинск','Зеленодол','Облачный','Ягодинск','Звёздный','Пряниково','Мармеладово','Светлогорск','Ветерок'];

/* ================= УТИЛИТЫ ================= */
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('moygorod_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('moygorod_'+k,JSON.stringify(v))}catch(e){}}};
function pl(n,f){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2]}
const mon=n=>`${n} ${pl(n,['монетка','монетки','монеток'])}`;
const COIN='<i class="coin"></i>';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const verb=(g,f,m,p)=>g==='f'?f:g==='m'?m:p;
function shade(hex,f){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(x=>Math.round(clamp(f<1?x*f:x+(255-x)*(f-1),0,255)));return '#'+c.map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ================= ЗВУК ================= */
let muted=store.get('muted',false),actx=null;
function beep(f,d,type){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const sfx={coin(){beep(880,.07);setTimeout(()=>beep(1320,.09),70)},pop(){beep(520,.1,'triangle')},bad(){beep(196,.2,'triangle')},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*110))}};
const SND_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SND_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function soundIcons(){document.querySelectorAll('[data-sound]').forEach(b=>b.innerHTML=muted?SND_OFF:SND_ON)}

/* ================= МАЛЕНЬКИЕ ИКОНКИ ================= */
function smile(h){
  const m=h>=70?0:h>=40?1:2,g=[['#fff6b0','#ffd23f','#f29a12'],['#efe4ff','#c4a2ff','#8a5cf0'],['#d9ecff','#8fc0ff','#4f7dff']][m];
  const eyes=m===0?'<path d="M7.6 10.6q1.6-1.8 3.2 0M13.2 10.6q1.6-1.8 3.2 0" stroke="#4a1d00" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
    :`<ellipse cx="9.2" cy="10.4" rx="1.4" ry="${m===2?1.5:1.8}" fill="#2a1060"/><ellipse cx="14.8" cy="10.4" rx="1.4" ry="${m===2?1.5:1.8}" fill="#2a1060"/><circle cx="9.7" cy="9.8" r=".5" fill="#fff"/><circle cx="15.3" cy="9.8" r=".5" fill="#fff"/>`;
  const mouth=m===0?'<path d="M8 13.6q4 4.6 8 0z" fill="#8a1f2b"/><path d="M9.6 15.4q2.4 1.4 4.8 0" stroke="#ff7d8f" stroke-width="1.2" fill="none" stroke-linecap="round"/>'
    :m===1?'<path d="M9.4 15.2q2.6 1 5.2-.4" stroke="#2a1060" stroke-width="1.5" fill="none" stroke-linecap="round"/>'
    :'<path d="M9 16.2q3-2.4 6 0" stroke="#2a1060" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M16.6 11.8q.9 1.6 0 2.4q-.9-.8 0-2.4z" fill="#bfe4ff"/>';
  return `<svg class="ico" viewBox="0 0 24 24"><defs><radialGradient id="sm${m}" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="${g[0]}"/><stop offset=".55" stop-color="${g[1]}"/><stop offset="1" stop-color="${g[2]}"/></radialGradient></defs><circle cx="12" cy="12.6" r="10.6" fill="${g[2]}" opacity=".5"/><circle cx="12" cy="12" r="10.6" fill="url(#sm${m})"/><ellipse cx="8.2" cy="6.4" rx="3.4" ry="1.8" fill="#fff" opacity=".7" transform="rotate(-25 8.2 6.4)"/>${m<2?'<ellipse cx="6.6" cy="13.6" rx="1.7" ry="1.1" fill="#ff7d9a" opacity=".55"/><ellipse cx="17.4" cy="13.6" rx="1.7" ry="1.1" fill="#ff7d9a" opacity=".55"/>':''}${eyes}${mouth}</svg>`}
const PEOPLE='<svg class="ico" viewBox="0 0 24 24" fill="#3c8f6a"><circle cx="8" cy="8" r="3.5"/><circle cx="16.5" cy="9" r="3"/><path d="M2 20c0-4 3-6.5 6-6.5s6 2.5 6 6.5z"/><path d="M13 20c.3-3 2-5 3.5-5s4.5 1.6 4.5 5z"/></svg>';
const HEART='<svg class="ico" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="#e8574a"/></svg>';
function face(r,size,mood){
  const s=size||54,m=mood||'ok';
  const brows=m==='happy'?'<path d="M21 26.5q4-3 7 0M32 26.5q4-3 7 0" stroke="#5a3a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
    :m==='sad'?'<path d="M21 26q4-1 7 1.6M32 27.6q3-2.6 7-1.6" stroke="#5a3a2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>':'';
  const eyes=m==='happy'?'<path d="M22.5 32q2.5-3 5 0M32.5 32q2.5-3 5 0" stroke="#2a2a2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>'
    :'<circle cx="25" cy="32" r="2" fill="#2a2a2a"/><circle cx="35" cy="32" r="2" fill="#2a2a2a"/><circle cx="25.6" cy="31.4" r=".6" fill="#fff"/><circle cx="35.6" cy="31.4" r=".6" fill="#fff"/>';

    :m==='sad'?'<path d="M25.5 41q4.5-4 9 0" stroke="#7a3a2e" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M39 31q1.3 2.4 0 3.4q-1.3-1 0-3.4z" fill="#9fd4ff"/>'
    :'<path d="M25 38 Q30 42 35 38" stroke="#b5574a" stroke-width="2" fill="none" stroke-linecap="round"/>';
  const bg=m==='happy'?'#fff0b8':m==='sad'?'#dfe6f2':'#ffe7c7';
  return `<svg class="face" viewBox="0 0 60 60" width="${s}" height="${s}" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="29" fill="${bg}"/>

  ${brows}${eyes}${mouth}${m!=='sad'?'<circle cx="21" cy="37" r="2.5" fill="#ff8f8f" opacity=".45"/><circle cx="39" cy="37" r="2.5" fill="#ff8f8f" opacity=".45"/>':''}</svg>`}
function bIcon(id){
  const st='stroke="#2c5446" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  if(id==='shop')return `<path d="M-10 -7h3.5l2.5 10h11l2.5-7.5H-5.5" ${st}/><circle cx="-2" cy="7" r="2" fill="#2c5446"/><circle cx="6" cy="7" r="2" fill="#2c5446"/>`;
  if(id==='homes')return `<path d="M-10 0 L0 -9 L10 0" ${st}/><path d="M-7 -2 V8 H7 V-2" ${st}/><rect x="-2" y="2" width="4" height="6" fill="#2c5446"/>`;
  if(id==='school')return `<polygon points="-11,-3 0,-9 11,-3 0,3" fill="#2c5446"/><path d="M-6 0 V5 Q0 9 6 5 V0" ${st}/><path d="M9 -2 V5" ${st}/>`;
  if(id==='park')return `<circle cx="0" cy="-3" r="7.5" fill="#3fae67"/><circle cx="-3" cy="-6" r="3.5" fill="#7ad08a"/><path d="M0 3 V10" stroke="#7a5a3c" stroke-width="3" stroke-linecap="round"/>`;
  return `<path d="M0 10 V-1" stroke="#2c5446" stroke-width="2.4" stroke-linecap="round"/><circle cx="0" cy="-5" r="5" fill="#ffd34d" stroke="#2c5446" stroke-width="2"/>`;
}
const iconSVG=(id,bg)=>`<svg viewBox="-16 -16 32 32">${bg?`<rect x="-16" y="-16" width="32" height="32" rx="8" fill="${bg}"/>`:''}${bIcon(id)}</svg>`;

/* ================= ИЗОМЕТРИЯ ================= */
const TW=50,TH=25,OX=200,OY=262;
const P=(i,j)=>[OX+(i-j)*TW/2,OY+(i+j)*TH/2];
const up=(p,h)=>[p[0],p[1]-h];
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const poly=(a,fill,extra)=>`<polygon points="${pts(a)}" fill="${fill}" ${extra||''}/>`;
const ST='stroke="#5b6b67" stroke-width="1.1" stroke-linejoin="round"';
const tile=(i,j,w,d,fill,extra)=>poly([P(i,j),P(i+w,j),P(i+w,j+d),P(i,j+d)],fill,extra);
function box(i,j,w,d,h,c){
  const A=P(i,j),Bp=P(i+w,j),C=P(i+w,j+d),D=P(i,j+d);
  return poly([D,C,up(C,h),up(D,h)],c.left,ST)+poly([C,Bp,up(Bp,h),up(C,h)],c.right,ST)+poly([up(A,h),up(Bp,h),up(C,h),up(D,h)],c.top,ST);
}
function roof(i,j,w,d,h,rh,col){
  const A=up(P(i,j),h),Bp=up(P(i+w,j),h),C=up(P(i+w,j+d),h),D=up(P(i,j+d),h),T=up(P(i+w/2,j+d/2),h+rh);
  return poly([A,Bp,T],shade(col,1.1),ST)+poly([A,D,T],shade(col,1.1),ST)+poly([D,C,T],col,ST)+poly([C,Bp,T],shade(col,.78),ST);
}
function fq(a,b,u0,u1,h0,h1,fill){const p0=lerp(a,b,u0),p1=lerp(a,b,u1);return poly([up(p0,h0),up(p1,h0),up(p1,h1),up(p0,h1)],fill)}
function windows(i,j,w,d,h,floors,fill,skipDoor){
  const Bp=P(i+w,j),C=P(i+w,j+d),D=P(i,j+d),fh=h/floors;let s='';
  for(let f=0;f<floors;f++){const h0=f*fh+fh*.32,h1=f*fh+fh*.72;
    const nL=Math.max(1,Math.round(w*2.2)),nR=Math.max(1,Math.round(d*2.2));
    for(let k=0;k<nL;k++){if(skipDoor&&f===0&&Math.abs((k+.5)/nL-.5)<.2)continue;s+=fq(D,C,(k+.25)/nL,(k+.75)/nL,h0,h1,fill)}
    for(let k=0;k<nR;k++)s+=fq(C,Bp,(k+.25)/nR,(k+.75)/nR,h0,h1,shade(fill,.9))}
  return s;
}
const walls=c=>({left:c,right:shade(c,.8),top:shade(c,1.15)});
function tree(i,j,s,dark){const [x,y]=P(i,j);s=s||1;
  return `<ellipse cx="${x}" cy="${y}" rx="${10*s}" ry="${4.5*s}" fill="#24563c" opacity=".22"/><rect x="${x-2.2*s}" y="${y-13*s}" width="${4.4*s}" height="${13*s}" rx="2" fill="#7a5a3c"/><circle cx="${x}" cy="${y-21*s}" r="${11.5*s}" fill="${dark?'#2f9a5c':'#3fae67'}"/><circle cx="${x-4*s}" cy="${y-25*s}" r="${6*s}" fill="#74cf80"/>`}
function lamp(i,j,L){const [x,y]=P(i,j),lit=L>0,r=6+L*4.5,op=(.22+.11*L).toFixed(2),head=L>=3?'#fff3a6':L?'#ffe066':'#9aa7a5';
  let s=lit?`<ellipse cx="${x}" cy="${y+2}" rx="${8+L*6}" ry="${4+L*3}" fill="#fff1a0" opacity="${op}"/><circle cx="${x}" cy="${y-31}" r="${r}" fill="#fff3a0" opacity="${op}"/><circle cx="${x}" cy="${y-31}" r="${r*.55}" fill="#fff8cf" opacity="${op}"/>`:'';
  s+=`<rect x="${x-1.5}" y="${y-30}" width="3" height="31" fill="#4d5a5a"/>`;

function esc(t){return String(t).replace(/[<>&"']/g,'')}
function archetype(){
  const sp=S.spendBy,green=sp.park+sp.lights,biz=sp.shop,build=sp.homes+sp.school,all=green+biz+build;
  if(!all)return {t:'Мэр-хранитель',d:'Ты почти ничего не тратил. Деньги целы, но город не вырос.'};
  if(S.hearts>=6)return {t:'Народный мэр',d:'Ты слышишь каждого жителя — город тебя обожает.'};
  if(S.coins>=110)return {t:'Бережливый мэр',d:'Ты умеешь копить и тратишь с умом.'};
  const m=Math.max(green,biz,build);
  if(m===green)return {t:'Мэр-садовник',d:'Ты сделал город зелёным, светлым и уютным.'};
  if(m===biz)return {t:'Мэр-предприниматель',d:'Ты знаешь: магазины пополняют бюджет каждый день.'};
  return {t:'Мэр-строитель',d:'Город растёт, в нём появляются новые семьи.'};
}
function headlines(){const n=S.news.slice().sort((a,b)=>b.w-a.w).map(x=>x.t);if(!n.length)n.push('В городе спокойно: мэр копит силы');return n.slice(0,3)}

function paperPeople(){const hits=S.log.filter(x=>x.hit),miss=S.log.filter(x=>!x.hit);let p=[...hits.slice(-2),...miss.slice(-1)];if(p.length<3)p=[...p,...S.log.filter(x=>!p.includes(x))].slice(0,3);return p.slice(0,3)}
function forecast(){return S.happy>=70?['Солнечно','Жители улыбаются весь день']:S.happy>=40?['Переменная облачность','Кому-то весело, кому-то не очень']:['Пасмурно','Жители ворчат, мэру есть над чем подумать']}

function wrap(x,text,maxW){const words=text.split(' '),lines=[];let cur='';words.forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}

      x.font=`italic 24px ${ser}`;wrap(x,'«'+(p.hit?p.r.thanks:p.r.complain)+'»',R-L-100).slice(0,2).forEach((l,j)=>x.fillText(l,L+100,y+58+j*28));
      y+=106});
    y=Math.max(y+4,H-150);x.fillStyle='#2b2b2b';x.fillRect(L,y,R-L,2);
    x.textAlign='left';x.fillStyle='#7b4cf0';x.font=`900 18px ${sys}`;x.fillText('МЭР НЕДЕЛИ',L,y+34);
    x.fillStyle='#1d1a14';x.font=`bold 28px ${ser}`;x.fillText(f.title,L,y+70);
    x.textAlign='right';x.fillStyle='#f2a91f';x.font=`bold 44px ${sys}`;x.fillText('★'.repeat(f.stars)+'☆'.repeat(3-f.stars),R,y+50);
    x.fillStyle='#1d1a14';x.font=`900 26px ${sys}`;x.fillText(f.pts+' очков',R,y+86);
    x.textAlign='center';x.fillStyle='#6b6252';x.font=`600 20px ${sys}`;x.fillText('Построишь город лучше?',W/2,H-44);
    try{return {cv,url:cv.toDataURL('image/jpeg',.85)}}catch(e){return null}
  };
  const res=draw(true)||draw(false)||{cv:null,url:''};
  S.cardCanvas=res.cv;S.cardUrl=res.url;
  show(`<h2>Газета для друзей</h2>${res.url?`<img class="cardimg" src="${res.url}" alt="Газета твоего города">`:''}<div class="actions"><button class="btn primary" data-act="share">Отправить друзьям</button><button class="btn secondary" data-act="close">Назад</button></div>`);
}
function share(){
  const text=`Мой город «${esc(S.city)}»: ${S.final.pts} очков. Я — ${S.final.title}! Построишь лучше?`;
  post('SHARING_EVENT',{text,image:S.cardUrl||undefined});vibrate();
}

/* ================= ОБЩЕЕ ================= */
function show(html){$('toast').classList.remove('show');$('dialog').innerHTML=html;$('shade').classList.add('show');$('dialog').scrollTop=0}
function hide(){$('shade').classList.remove('show')}
let tt;function toast(m){const t=$('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1900)}
function randomName(){return CITY_NAMES[Math.floor(Math.random()*CITY_NAMES.length)]}
function nameDialog(){show(`<div class="kicker">НОВЫЙ ГОРОД</div><h2>Как назовём твой город?</h2><input id="cityName" class="namein" maxlength="16" value="${randomName()}" aria-label="Название города"><p class="lvl">Название попадёт в газету и на карточку для друзей</p><div class="actions"><button class="btn big2" style="width:100%;font-size:19px;padding:17px" data-act="go">Основать город <span class="arr">→</span></button><button class="btn secondary" data-act="rename">Другое название</button></div>`)}
function help(){show(`<h2>Как играть</h2><ul class="howto"><li>Ты мэр города на <b>7 дней</b>.</li><li>Жми на значок над зданием и <b>улучшай</b> его. В день — 2 улучшения.</li><li>Улучшение стоит монетки, а потом <b>1 монетку в день</b> на уход.</li><li>Помоги жителю дня — получишь ${HEART} <b>сердечко</b>.</li><li>Вечером считаем: <b>заработал − потратил = прибыль</b>.</li></ul>
<div class="actions"><button class="btn primary" data-act="close">Понятно</button></div>`)}
function toggleSound(){muted=!muted;store.set('muted',muted);soundIcons();if(!muted)sfx.pop()}
function post(type,extra){try{window.postMessage(Object.assign({type},extra||{}),'*')}catch(e){}}
function vibrate(){post('VIBRATION_EVENT')}
let completedSent=false;
function exitGame(){post('CLOSE_EVENT')}
/* ===== СТАРТ: фон, облака, логотип ===== */
const CLOUD=[[62,150,58],[140,112,76],[232,98,70],[312,132,58],[372,164,46],[200,168,62],[100,186,52],[288,186,52],[30,196,40]];
function cloudSVG(flip,lilac){
  const g=()=>CLOUD.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join(''),id=lilac?'cl':'cw';
  const st=lilac?['#fbf7ff','#eadfff','#d2c0fb','#b8a3f0']:['#ffffff','#f6f9ff','#e4ecf8','#c9d8ee'];
  return `<svg viewBox="-20 20 440 230" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="${id}" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="${st[0]}"/><stop offset=".65" stop-color="${st[1]}"/><stop offset="1" stop-color="${st[2]}"/></radialGradient></defs>
  <g${flip?' transform="translate(400 0) scale(-1 1)"':''}><g fill="${st[3]}" transform="translate(0 12)">${g()}</g><g fill="url(#${id})">${g()}</g>
  <g fill="#fff" opacity=".85"><circle cx="120" cy="92" r="24"/><circle cx="220" cy="80" r="20"/><circle cx="52" cy="132" r="16"/></g></g></svg>`;
}
/* буквы нарисованы контурами: жирный узкий гротеск, без внешних шрифтов */
const GL={
  'М':[78,'M0 0H24L39 40L54 0H78V100H56V50L45 80H33L22 50V100H0Z'],
  'О':[64,'M22 0H42A22 22 0 0 1 64 22V78A22 22 0 0 1 42 100H22A22 22 0 0 1 0 78V22A22 22 0 0 1 22 0ZM28 25H36A6 6 0 0 1 42 31V69A6 6 0 0 1 36 75H28A6 6 0 0 1 22 69V31A6 6 0 0 1 28 25Z'],
  'Й':[66,'M0 0H22V50L44 0H66V100H44V50L22 100H0ZM12 -24H26Q33 -14 40 -24H54Q48 -6 33 -6Q18 -6 12 -24Z'],
  'Г':[54,'M0 0H54V24H24V100H0Z'],
  'Р':[64,'M0 0H40A24 24 0 0 1 64 24V42A24 24 0 0 1 40 66H24V100H0ZM24 22H36A6 6 0 0 1 42 28V38A6 6 0 0 1 36 44H24Z'],
  'Д':[78,'M14 76L20 0H66V76H78V118H58V100H20V118H0V76ZM38 22H46V76H34Z']
};
function word(txt,gap){let x=0,d='';[...txt].forEach(ch=>{const [w,p]=GL[ch];d+=`<path fill-rule="evenodd" transform="translate(${x} 0)" d="${p}"/>`;x+=w+gap});return {d,w:x-gap}}
function logoSVG(){
  const top=word('МОЙ',6),big=word('ГОРОД',6);
  const ext=(id,n,col,dx,dy)=>Array.from({length:n},(_,i)=>`<use href="#${id}" fill="${col}" transform="translate(${(n-i)*dx} ${(n-i)*dy})"/>`).join('');
  const star=(n,R,r)=>Array.from({length:n*2},(_,i)=>{const a=Math.PI*i/n-Math.PI/2,rr=i%2?r:R;return `${(Math.cos(a)*rr).toFixed(1)},${(Math.sin(a)*rr).toFixed(1)}`}).join(' ');
  const spark=(x,y,r,c)=>`<path d="M${x} ${y-r}Q${x+r*.15} ${y-r*.15} ${x+r} ${y}Q${x+r*.15} ${y+r*.15} ${x} ${y+r}Q${x-r*.15} ${y+r*.15} ${x-r} ${y}Q${x-r*.15} ${y-r*.15} ${x} ${y-r}Z" fill="${c}"/>`;
  return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"><defs>
  <g id="wT">${top.d}</g><g id="wB">${big.d}</g>
  <linearGradient id="fB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f1ebff"/><stop offset="1" stop-color="#c9b6ff"/></linearGradient>
  <linearGradient id="fT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9fb"/><stop offset=".3" stop-color="#e09cff"/><stop offset=".6" stop-color="#9d6bff"/><stop offset="1" stop-color="#8fb4ff"/></linearGradient>
  <linearGradient id="fS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2ff9c"/><stop offset=".5" stop-color="#c8f53a"/><stop offset="1" stop-color="#8fd21a"/></linearGradient>
  <radialGradient id="fP" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e6d6ff"/><stop offset=".5" stop-color="#9b6cff"/><stop offset="1" stop-color="#5a2fd6"/></radialGradient></defs>
  <g transform="translate(26 110) skewX(-9) scale(1.02)">
    ${ext('wB',9,'#24105e',1.3,1.5)}<use href="#wB" fill="#3b1c96" transform="translate(1.4 1.6)"/>
    <use href="#wB" fill="url(#fB)"/>
    <use href="#wB" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/>
  </g>
  <g transform="translate(34 38) skewX(-9) scale(.62) rotate(-3)">
    ${ext('wT',8,'#24105e',1.6,1.8)}<use href="#wT" fill="url(#fT)"/><use href="#wT" fill="none" stroke="#fff" stroke-width="2" opacity=".55"/>
  </g>
  <g transform="translate(330 74) rotate(14)">
    <polygon points="${star(10,54,40)}" fill="#24105e" transform="translate(4 5)"/>
    <polygon points="${star(10,54,40)}" fill="url(#fS)" stroke="#24105e" stroke-width="3" stroke-linejoin="round"/>
    <text text-anchor="middle" y="0" font-family="system-ui,-apple-system,Roboto,sans-serif" font-weight="900" font-size="32" fill="#24105e" stroke="#24105e" stroke-width="2" stroke-linejoin="round">7</text>
    <text text-anchor="middle" y="22" font-family="system-ui,-apple-system,Roboto,sans-serif" font-weight="900" font-size="16" letter-spacing="1.5" fill="#24105e" stroke="#24105e" stroke-width="1.1" stroke-linejoin="round">ДНЕЙ</text>
  </g>
  <g class="coins"><g transform="translate(30 240) rotate(-12)"><path d="${'M0 -22 Q4 -4 22 0 Q4 4 0 22 Q-4 4 -22 0 Q-4 -4 0 -22Z'}" fill="url(#fP)"/><path d="M-6 -10 Q-2 -6 -10 -2" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/></g>
  ${spark(186,26,12,'#fff')}${spark(388,170,9,'#fff')}${spark(250,40,7,'#e4ff6a')}</g>
  </svg>`;
}
function toStart(){
  hide();closeSheet();$('result').classList.add('hidden');
  const st=$('start');st.className='start';
  st.innerHTML=`<img class="sbg" src="img/start.webp" alt="" decoding="async" onerror="this.remove()">
  <div class="cl cl1">${cloudSVG(0,0)}</div><div class="cl cl2">${cloudSVG(1,1)}</div><div class="cl cl3">${cloudSVG(0,1)}</div><div class="cl cl4">${cloudSVG(1,0)}</div><div class="cl cl5">${cloudSVG(0,0)}</div><div class="cl cl6">${cloudSVG(1,1)}</div>
  <div class="sbar2"><button class="icon" data-act="exit" aria-label="Выйти">✕</button><button class="icon" data-act="sound" data-sound aria-label="Звук"></button></div>
  <div class="logo2"><div class="bob">${logoSVG()}</div><div class="tag2">Стань мэром и управляй бюджетом</div></div>
  <div class="cta2"><button class="big2" data-act="start">Начать игру <span class="arr">→</span></button><button class="pill2" data-act="help"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1c0f4a" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2.5"/></svg>5–10 минут · как играть</button></div>`;
  soundIcons();
}
function openStart(){
  const st=$('start');if(st.classList.contains('opening'))return;
  st.classList.add('opening');beep(330,.5,'sine');setTimeout(()=>beep(660,.4,'sine'),180);vibrate();
  setTimeout(nameDialog,1150);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  switch(a){
    case 'start':openStart();break;
    case 'again':newGame(S.city);break;
    case 'rename':$('cityName').value=randomName();break;
    case 'go':newGame(esc($('cityName').value.trim()).slice(0,16)||'Солнечноград');break;
    case 'home':S=null;toStart();$('start').classList.remove('hidden');break;
    case 'help':help();break;
    case 'close':hide();break;
    case 'startday':hide();{const q=$('req');q.classList.remove('pop');void q.offsetWidth;q.classList.add('pop')}break;
    case 'b':openB(v);break;
    case 'req':if(S){const r=today();show(`<div class="quote">${face(r,54)}<div><b>${r.name}</b><p>«${r.text}»</p></div></div><p>${S.reqDone?'Просьба выполнена — спасибо, мэр!':'Подумай, какое здание поможет. Найди его в городе и поддержи.'}</p><div class="actions"><button class="btn primary" data-act="close">Понятно</button></div>`)}break;
    case 'support':support(v);break;
    case 'closeSheet':closeSheet();break;
    case 'evening':evening();break;
    case 'next':nextDay();break;
    case 'final':finale();break;
    case 'fest':fest(v==='yes');break;
    case 'storm':storm(v==='yes');break;
    case 'card':makeCard();break;
    case 'share':share();break;
    case 'sound':toggleSound();break;
    case 'exit':exitGame();break;
  }
});
$('sheetShade').addEventListener('click',e=>{if(e.target===$('sheetShade'))closeSheet()});
soundIcons();
toStart();
</script>
